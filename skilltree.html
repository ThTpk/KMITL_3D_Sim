<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skill Tree | KMITL 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/skilltree.css?v=20261027a" />
</head>
<body>
  <div id="fit">
    <main id="stage">
      <svg class="gear" width="1590" height="1080" aria-hidden="true">
        <circle cx="700" cy="540" r="210" /><circle class="d" cx="700" cy="540" r="300" /><circle cx="700" cy="540" r="410" />
        <circle class="d" cx="700" cy="540" r="470" /><circle cx="700" cy="540" r="120" />
      </svg>
      <div id="bands"></div>
      <div id="rowlabels"></div>
      <svg class="edges" width="1590" height="1080" aria-hidden="true">
        <path class="e-sh" id="e-all" /><path class="e-off" id="e-off" /><path class="e-onb" id="e-onb" /><path class="e-on" id="e-on" />
      </svg>
      <div id="nodes"></div>

      <header class="hdr">
        <a class="logo" href="index.html" title="กลับไปแผนที่">KMITL</a>
        <div class="ttl"><b id="h-th">Skill Tree</b><span id="h-sub"></span></div>
        <a class="nav" href="programs.html">เลือกหลักสูตรอื่น</a>
        <div class="sp"></div>
        <div class="stat"><b id="st-credits"></b>หน่วยกิตสะสม</div>
        <div class="stat"><b id="st-elec"></b>วิชาเลือกที่เลือก</div>
        <div class="stat"><b id="st-car"></b>อาชีพที่ปลดล็อก</div>
        <div class="ctl">
          <button id="prev" class="btn sq" aria-label="ย้อนกลับหนึ่งภาคเรียน"><svg width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg></button>
          <div class="term"><span>ภาคเรียนที่เรียนแล้ว</span><b id="term-lbl"></b></div>
          <button id="next" class="btn sq" aria-label="เรียนภาคเรียนถัดไป"><svg width="24" height="24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg></button>
          <button id="play" class="btn pri"><svg width="24" height="24" aria-hidden="true"><path id="play-ico" /></svg><span id="play-lbl"></span></button>
          <button id="reset" class="btn"><svg width="24" height="24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4" /></svg>เริ่มใหม่</button>
        </div>
      </header>

      <footer class="ft">
        <div class="lg">
          <span><i class="sw"></i>วิชาบังคับ (มคอ.2): กดหัวคอลัมน์หรือ ‹ › เพื่อเรียนทีละภาคเรียน</span>
          <span><i class="sw el"></i>วิชาเลือก: กดเพื่อเลือก กดซ้ำเพื่อยกเลิก หรือกด “ทั้งแทร็ก”</span>
          <span><i class="sw ca"></i>อาชีพ: ปลดล็อกเมื่อทักษะถึงเกณฑ์ กดเพื่อเลือกวิชาเลือกที่แนะนำ</span>
        </div>
        <div class="src" id="src"></div>
      </footer>

      <aside class="pn" aria-live="polite">
        <div class="ph">
          <div class="pic" id="p-pic"><svg width="24" height="24" aria-hidden="true"><path id="p-ico" /></svg></div>
          <div class="pt"><span class="code" id="p-code"></span><b id="p-th"></b><span id="p-en"></span></div>
        </div>
        <div class="meta" id="p-meta"></div>
        <div class="status" id="p-status"></div>
        <div class="rq" id="p-req"></div>
        <div class="rw">
          <svg class="radar" width="276" height="240" aria-hidden="true">
            <path class="r-grid" id="r-grid" /><path class="r-ax" id="r-ax" />
            <polygon class="r-tg" id="r-tg" /><polygon class="r-cur" id="r-cur" /><polygon class="r-alt" id="r-alt" />
          </svg>
          <div id="r-labels"></div>
        </div>
        <div class="rk"><span><i></i><em id="k-cur"></em></span><span><i class="a"></i><em id="k-alt"></em></span><span><i class="t"></i><em id="k-tg"></em></span></div>
        <div class="bars" id="bars"></div>
        <div class="hint" id="p-hint"></div>
      </aside>
    </main>
  </div>
  <script type="module" src="js/skilltree.js?v=20261027a"></script>
</body>
</html>
